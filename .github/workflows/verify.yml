name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: linux (bash 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: report the environment
        run: |
          bash --version | head -1
          jq --version
          git --version
          python3 --version
      - run: make verify-all

  macos-bash32:
    # The floor is stock macOS /bin/bash 3.2. Running the same suite under it is
    # the only thing that keeps a bash-4-ism from reaching a consumer's Mac.
    name: macos (bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: report the environment
        run: |
          /bin/bash --version | head -1
          jq --version
          git --version
      - run: make verify BASH=/bin/bash

  plugins:
    # The only job that needs the Claude CLI. It is separate so that a CLI or
    # registry problem reads as a plugin-manifest failure rather than taking the
    # behavioural suite down with it — the other two jobs cover behaviour and
    # need nothing but jq, git and python3.
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: report the environment
        run: claude --version
      - run: make verify-plugins
      # The context ceiling can only be enforced where the plugins are actually
      # installed — `claude plugin details` reports nothing otherwise, every
      # plugin cost counts as 0, and the gate passes on the declarative half
      # alone. That was the state for a long time: the two jobs that ran the
      # ceiling had no CLI, and this job, the only one with a CLI, never ran it.
      # superpowers is an external dependency declared in harness-dev's manifest
      # and it carries real always-on cost, so the ceiling is meaningless without
      # it. Leaving it out is what the first run of this step did, and the gate
      # caught it — the list below is safe to hardcode precisely because an
      # omission fails loudly as "plugin cost unreadable" rather than passing.
      - name: install the marketplaces and plugins from this checkout
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin marketplace add anthropics/claude-plugins-official
          claude plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill
          for p in core dev research slides frontend; do
            claude plugin install "harness-$p@agent-harness" --scope user
          done
          claude plugin install superpowers@claude-plugins-official --scope user
      - run: make context-budget-strict
      # The published check total has the same shape as the ceiling above, and
      # the same hole was left open. `verify-check-total` wraps `verify` and
      # reads its output, so without a CLI the plugin-manifest count is 0 and
      # it *skips* the comparison — "the run total is 813 and cannot be
      # compared with the published 827". Every republished total was therefore
      # self-reported, and one of them was wrong by one: it had been measured
      # on a clone polluted with a stray file. This is the only job that can
      # check it, exactly as it is the only one that can enforce the ceiling.
      - run: make verify-all
